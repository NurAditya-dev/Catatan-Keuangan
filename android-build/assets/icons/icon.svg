<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>
  <!-- App Icon Squircle Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  
  <!-- Subtle Glowing Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#accentGrad)" stroke-width="3" opacity="0.2" />

  <!-- Wallet / Card Base -->
  <g filter="url(#shadow)">
    <rect x="116" y="156" width="280" height="200" rx="36" fill="url(#accentGrad)" />
    <!-- Inner Card Layer -->
    <path d="M146 132 H346 A24 24 0 0 1 370 156 V166 H122 V156 A24 24 0 0 1 146 132 Z" fill="url(#goldGrad)" opacity="0.9" />
    <!-- Wallet Clasp -->
    <rect x="316" y="226" width="96" height="60" rx="18" fill="#0F172A" />
    <circle cx="346" cy="256" r="12" fill="url(#goldGrad)" />
    <!-- Upward Chart Line Inside Wallet -->
    <path d="M156 296 L206 246 L246 272 L300 204" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="300" cy="204" r="10" fill="#FFFFFF" />
  </g>
</svg>
